spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/collab}
    username: ${DB_USERNAME:collab}
    password: ${DB_PASSWORD:collab}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    show-sql: false

logging:
  level:
    com.collab: DEBUG
    org.springframework.security: INFO
