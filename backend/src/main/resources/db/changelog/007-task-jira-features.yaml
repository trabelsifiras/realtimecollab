            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_task_attachments_task
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: task_attachments
            baseColumnNames: uploader_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_task_attachments_uploader
        - addForeignKeyConstraint:
            baseTableName: task_links
            baseColumnNames: source_task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_task_links_source
            onDelete: CASCADE
        - addForeignKeyConstraint:
