  - changeSet:
      id: 007-10-fks-task-jira
      author: collab
      changes:
        - addForeignKeyConstraint:
            baseTableName: task_sequences
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_task_sequences_project
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: parent_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_tasks_parent
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: epic_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_tasks_epic
        - addForeignKeyConstraint:
            baseTableName: task_labels
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_task_labels_task
